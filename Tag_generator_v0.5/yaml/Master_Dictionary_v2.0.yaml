object_standalones:
  description: Objects that can be used as standalone components without further specification
  values:
    - mainsheet
    - mizzensheet
       
object_specifiers:
  description: Specifiers that can be used to form a component when combined with an object_type
  values:  
    # Sail related
    - jib
    - genoa
    - code0
    - mizzen
    - main
    - boom
    - inner

    # Winch roles
    - primary
    - secondary
    - mooring
    - captive

    # Anchoring
    - anchor

    # Thruster roles
    - bow
    - stern

    - dinghy
    - transom

modifiers:
  description: Modifiers that can be used to further specify a component
  values:
    # Magnitude
    - high
    - low
    - highhigh
    - lowlow

    # Speed
    - fast
    - slow

    # Mode
    - auto
    - manual

    # Direction
    - cw
    - ccw

    # Priority
    - emergency

